<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Movie Watch List</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: Arial, sans-serif;
                line-height: 1.6;
                color: #333;
                background-color: #f4f4f4;
                padding: 20px;
            }

            .container {
                max-width: 1200px;
                margin: 0 auto;
                background: white;
                padding: 20px;
                border-radius: 10px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            }

            h1 {
                text-align: center;
                color: #2c3e50;
                margin-bottom: 30px;
            }

            .section {
                margin-bottom: 30px;
                padding: 20px;
                border: 1px solid #ddd;
                border-radius: 5px;
                background-color: #fafafa;
            }

            .section h2 {
                color: #34495e;
                margin-bottom: 15px;
                border-bottom: 2px solid #3498db;
                padding-bottom: 5px;
            }

            .form-group {
                margin-bottom: 15px;
            }

            label {
                display: block;
                margin-bottom: 5px;
                font-weight: bold;
            }

            input,
            select {
                width: 100%;
                padding: 8px;
                border: 1px solid #ddd;
                border-radius: 4px;
                font-size: 14px;
            }

            button {
                background-color: #3498db;
                color: white;
                padding: 10px 20px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 14px;
                margin-right: 10px;
                margin-bottom: 10px;
            }

            button:hover {
                background-color: #2980b9;
            }

            button.delete {
                background-color: #e74c3c;
            }

            button.delete:hover {
                background-color: #c0392b;
            }

            button.watch {
                background-color: #27ae60;
            }

            button.watch:hover {
                background-color: #229954;
            }

            .movie-list,
            .user-list {
                margin-top: 20px;
            }

            .movie-item,
            .user-item {
                background: white;
                padding: 15px;
                margin-bottom: 10px;
                border-radius: 5px;
                border-left: 4px solid #3498db;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .movie-info h3 {
                color: #2c3e50;
                margin-bottom: 5px;
            }

            .movie-info p {
                color: #7f8c8d;
                font-size: 14px;
            }

            .movie-actions {
                display: flex;
                gap: 10px;
            }

            .message {
                padding: 10px;
                margin: 10px 0;
                border-radius: 4px;
                display: none;
            }

            .message.success {
                background-color: #d4edda;
                color: #155724;
                border: 1px solid #c3e6cb;
            }

            .message.error {
                background-color: #f8d7da;
                color: #721c24;
                border: 1px solid #f5c6cb;
            }

            .loading {
                display: none;
                text-align: center;
                color: #666;
                font-style: italic;
            }

            .form-row {
                display: flex;
                gap: 15px;
                align-items: end;
            }

            .form-row .form-group {
                flex: 1;
            }

            .current-user {
                background-color: #e8f5e8;
                padding: 10px;
                border-radius: 5px;
                margin-bottom: 20px;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>🎬 Movie Watch List</h1>

            <div class="current-user">
                <strong
                    >Current User: <span id="currentUser">demo</span></strong
                >
                <button onclick="switchUser()" style="margin-left: 10px">
                    Switch User
                </button>
            </div>

            <div id="message" class="message"></div>

            <!-- User Management Section -->
            <div class="section">
                <h2>👥 User Management</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="newUsername">Create New User:</label>
                        <input
                            type="text"
                            id="newUsername"
                            placeholder="Enter username"
                        />
                    </div>
                    <div>
                        <button onclick="createUser()">Create User</button>
                    </div>
                </div>
                <button onclick="loadUsers()">Refresh Users</button>
                <div id="usersList" class="user-list"></div>
            </div>

            <!-- Movie Management Section -->
            <div class="section">
                <h2>🎭 Add New Movie</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="movieTitle">Movie Title:</label>
                        <input
                            type="text"
                            id="movieTitle"
                            placeholder="Enter movie title"
                        />
                    </div>
                    <div class="form-group">
                        <label for="releaseDate">Release Date:</label>
                        <input type="date" id="releaseDate" />
                    </div>
                    <div>
                        <button onclick="createMovie()">Add Movie</button>
                    </div>
                </div>
            </div>

            <!-- Movies Display Section -->
            <div class="section">
                <h2>🍿 All Movies</h2>
                <button onclick="loadAllMovies()">Refresh All Movies</button>
                <div id="loadingAllMovies" class="loading">
                    Loading movies...
                </div>
                <div id="allMoviesList" class="movie-list"></div>
            </div>

            <div class="section">
                <h2>⏰ Upcoming Movies</h2>
                <button onclick="loadUpcomingMovies()">
                    Refresh Upcoming Movies
                </button>
                <div id="loadingUpcoming" class="loading">
                    Loading upcoming movies...
                </div>
                <div id="upcomingMoviesList" class="movie-list"></div>
            </div>

            <div class="section">
                <h2>✅ My Watched Movies</h2>
                <button onclick="loadWatchedMovies()">
                    Refresh Watched Movies
                </button>
                <div id="loadingWatched" class="loading">
                    Loading watched movies...
                </div>
                <div id="watchedMoviesList" class="movie-list"></div>
            </div>
        </div>

        <script>
            const API_BASE = "http://localhost:8080";
            let currentUser = "demo";

            // Utility functions
            function showMessage(text, type = "success") {
                const messageEl = document.getElementById("message");
                messageEl.textContent = text;
                messageEl.className = `message ${type}`;
                messageEl.style.display = "block";
                setTimeout(() => {
                    messageEl.style.display = "none";
                }, 3000);
            }

            function showLoading(elementId, show = true) {
                const el = document.getElementById(elementId);
                if (el) el.style.display = show ? "block" : "none";
            }

            function formatDate(dateString) {
                return new Date(dateString).toLocaleDateString();
            }

            function formatDateForAPI(dateString) {
                const date = new Date(dateString);
                const day = String(date.getDate()).padStart(2, "0");
                const month = String(date.getMonth() + 1).padStart(2, "0");
                const year = date.getFullYear();
                return `${day}-${month}-${year}`;
            }

            // User Management
            async function createUser() {
                const username = document
                    .getElementById("newUsername")
                    .value.trim();
                if (!username) {
                    showMessage("Please enter a username", "error");
                    return;
                }

                try {
                    const response = await fetch(`${API_BASE}/users`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({ user_name: username }),
                    });

                    const data = await response.json();
                    if (data.status === 200) {
                        showMessage(data.message);
                        document.getElementById("newUsername").value = "";
                        loadUsers();
                    }
                } catch (error) {
                    showMessage(
                        "Error creating user: " + error.message,
                        "error",
                    );
                }
            }

            async function loadUsers() {
                try {
                    const response = await fetch(`${API_BASE}/users`);
                    const users = await response.json();

                    const usersList = document.getElementById("usersList");
                    usersList.innerHTML = "";

                    users.forEach((user) => {
                        const userName = user[0]; // Users are returned as arrays: ["username"]
                        const userEl = document.createElement("div");
                        userEl.className = "user-item";
                        userEl.innerHTML = `
                        <div>
                            <h3>${userName}</h3>
                        </div>
                        <div>
                            <button onclick="setCurrentUser('${userName}')">Select</button>
                            <button class="delete" onclick="deleteUser('${userName}')">Delete</button>
                        </div>
                    `;
                        usersList.appendChild(userEl);
                    });
                } catch (error) {
                    showMessage(
                        "Error loading users: " + error.message,
                        "error",
                    );
                }
            }

            async function deleteUser(username) {
                if (
                    !confirm(
                        `Are you sure you want to delete user "${username}"?`,
                    )
                )
                    return;

                try {
                    const response = await fetch(
                        `${API_BASE}/users/${username}/delete`,
                        {
                            method: "DELETE",
                        },
                    );

                    const data = await response.json();
                    if (data.status === 200) {
                        showMessage(data.message);
                        loadUsers();
                        if (currentUser === username) {
                            currentUser = "demo";
                            document.getElementById("currentUser").textContent =
                                currentUser;
                        }
                    }
                } catch (error) {
                    showMessage(
                        "Error deleting user: " + error.message,
                        "error",
                    );
                }
            }

            function setCurrentUser(username) {
                currentUser = username;
                document.getElementById("currentUser").textContent =
                    currentUser;
                showMessage(`Switched to user: ${username}`);
                loadWatchedMovies();
            }

            function switchUser() {
                const username = prompt("Enter username:", currentUser);
                if (username && username.trim()) {
                    setCurrentUser(username.trim());
                }
            }

            // Movie Management
            async function createMovie() {
                const title = document
                    .getElementById("movieTitle")
                    .value.trim();
                const releaseDate =
                    document.getElementById("releaseDate").value;

                if (!title || !releaseDate) {
                    showMessage(
                        "Please enter both movie title and release date",
                        "error",
                    );
                    return;
                }

                try {
                    const response = await fetch(`${API_BASE}/movies`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({
                            title: title,
                            release_date: formatDateForAPI(releaseDate),
                        }),
                    });

                    const data = await response.json();
                    if (data.status === 200) {
                        showMessage(data.message);
                        document.getElementById("movieTitle").value = "";
                        document.getElementById("releaseDate").value = "";
                        loadAllMovies();
                        loadUpcomingMovies();
                    }
                } catch (error) {
                    showMessage(
                        "Error creating movie: " + error.message,
                        "error",
                    );
                }
            }

            async function loadAllMovies() {
                showLoading("loadingAllMovies");
                try {
                    const response = await fetch(`${API_BASE}/movies`);
                    const movies = await response.json();

                    const moviesList = document.getElementById("allMoviesList");
                    moviesList.innerHTML = "";

                    movies.forEach((movie) => {
                        // Movies are returned as arrays: [id, title, timestamp]
                        const movieId = movie[0];
                        const movieTitle = movie[1];
                        const movieReleaseDate = new Date(movie[2] * 1000); // Convert Unix timestamp to Date

                        const movieEl = document.createElement("div");
                        movieEl.className = "movie-item";
                        movieEl.innerHTML = `
                        <div class="movie-info">
                            <h3>${movieTitle}</h3>
                            <p>Release Date: ${formatDate(movieReleaseDate)}</p>
                        </div>
                        <div class="movie-actions">
                            <button class="watch" onclick="watchMovie(${movieId})">Mark as Watched</button>
                            <button class="delete" onclick="deleteMovie(${movieId})">Delete</button>
                        </div>
                    `;
                        moviesList.appendChild(movieEl);
                    });
                } catch (error) {
                    showMessage(
                        "Error loading movies: " + error.message,
                        "error",
                    );
                } finally {
                    showLoading("loadingAllMovies", false);
                }
            }

            async function loadUpcomingMovies() {
                showLoading("loadingUpcoming");
                try {
                    const response = await fetch(`${API_BASE}/movies/upcoming`);
                    const movies = await response.json();

                    const moviesList =
                        document.getElementById("upcomingMoviesList");
                    moviesList.innerHTML = "";

                    movies.forEach((movie) => {
                        // Movies are returned as arrays: [id, title, timestamp]
                        const movieId = movie[0];
                        const movieTitle = movie[1];
                        const movieReleaseDate = new Date(movie[2] * 1000); // Convert Unix timestamp to Date

                        const movieEl = document.createElement("div");
                        movieEl.className = "movie-item";
                        movieEl.innerHTML = `
                        <div class="movie-info">
                            <h3>${movieTitle}</h3>
                            <p>Release Date: ${formatDate(movieReleaseDate)}</p>
                        </div>
                        <div class="movie-actions">
                            <button class="watch" onclick="watchMovie(${movieId})">Mark as Watched</button>
                            <button class="delete" onclick="deleteMovie(${movieId})">Delete</button>
                        </div>
                    `;
                        moviesList.appendChild(movieEl);
                    });
                } catch (error) {
                    showMessage(
                        "Error loading upcoming movies: " + error.message,
                        "error",
                    );
                } finally {
                    showLoading("loadingUpcoming", false);
                }
            }

            async function loadWatchedMovies() {
                showLoading("loadingWatched");
                try {
                    const response = await fetch(
                        `${API_BASE}/movies/${currentUser}/watched`,
                    );
                    const movies = await response.json();

                    const moviesList =
                        document.getElementById("watchedMoviesList");
                    moviesList.innerHTML = "";

                    movies.forEach((movie) => {
                        // Movies are returned as arrays: [id, title, timestamp]
                        const movieId = movie[0];
                        const movieTitle = movie[1];
                        const movieReleaseDate = new Date(movie[2] * 1000); // Convert Unix timestamp to Date

                        const movieEl = document.createElement("div");
                        movieEl.className = "movie-item";
                        movieEl.innerHTML = `
                        <div class="movie-info">
                            <h3>${movieTitle}</h3>
                            <p>Release Date: ${formatDate(movieReleaseDate)}</p>
                        </div>
                        <div class="movie-actions">
                            <button onclick="unwatchMovie(${movieId})">Unwatch</button>
                            <button class="delete" onclick="deleteMovie(${movieId})">Delete Movie</button>
                        </div>
                    `;
                        moviesList.appendChild(movieEl);
                    });
                } catch (error) {
                    showMessage(
                        "Error loading watched movies: " + error.message,
                        "error",
                    );
                } finally {
                    showLoading("loadingWatched", false);
                }
            }

            async function watchMovie(movieId) {
                try {
                    const response = await fetch(
                        `${API_BASE}/movies/${movieId}/watch`,
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                            },
                            body: JSON.stringify({ user_name: currentUser }),
                        },
                    );

                    const data = await response.json();
                    if (data.status === 200) {
                        showMessage(
                            `Movie marked as watched for ${currentUser}`,
                        );
                        loadWatchedMovies();
                    }
                } catch (error) {
                    showMessage(
                        "Error marking movie as watched: " + error.message,
                        "error",
                    );
                }
            }

            async function unwatchMovie(movieId) {
                try {
                    const response = await fetch(
                        `${API_BASE}/movies/${movieId}/unwatch`,
                        {
                            method: "DELETE",
                            headers: {
                                "Content-Type": "application/json",
                            },
                            body: JSON.stringify({ user_name: currentUser }),
                        },
                    );

                    const data = await response.json();
                    if (data.status === 200) {
                        showMessage(
                            `Movie removed from ${currentUser}'s watched list`,
                        );
                        loadWatchedMovies();
                    }
                } catch (error) {
                    showMessage(
                        "Error unwatching movie: " + error.message,
                        "error",
                    );
                }
            }

            async function deleteMovie(movieId) {
                if (!confirm("Are you sure you want to delete this movie?"))
                    return;

                try {
                    const response = await fetch(
                        `${API_BASE}/movies/${movieId}`,
                        {
                            method: "DELETE",
                        },
                    );

                    const data = await response.json();
                    if (data.status === 200) {
                        showMessage(data.message);
                        loadAllMovies();
                        loadUpcomingMovies();
                        loadWatchedMovies();
                    }
                } catch (error) {
                    showMessage(
                        "Error deleting movie: " + error.message,
                        "error",
                    );
                }
            }

            // Initialize the app
            document.addEventListener("DOMContentLoaded", function () {
                loadUsers();
                loadAllMovies();
                loadUpcomingMovies();
                loadWatchedMovies();
            });
        </script>
    </body>
</html>
